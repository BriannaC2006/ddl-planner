<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><title>DDL Planner 临时迁移</title><body><h1>DDL Planner 临时迁移</h1><p>数据仅在当前浏览器处理，不发送到服务器。同 ID 记录以导入内容为准，原数据会备份。</p><button id="read">读取当前数据</button><textarea id="data" aria-label="迁移数据" style="display:block;width:90%;height:260px"></textarea><button id="merge">备份并合并</button><button id="undo">撤销本次迁移</button><pre id="status" role="status"></pre><script>
const key='ddl-planner-v1', backup='ddl-planner-migration-backup-v1';
const field=document.getElementById('data'), status=document.getElementById('status');
function validate(d){if(!d||!Array.isArray(d.courses)||!Array.isArray(d.assignments))throw Error('数据格式错误');for(const c of d.courses)if(typeof c.id!=='string'||typeof c.name!=='string')throw Error('课程数据格式错误');for(const a of d.assignments)if(typeof a.id!=='string'||typeof a.title!=='string'||typeof a.courseId!=='string')throw Error('作业数据格式错误');return d;}
document.getElementById('read').onclick=()=>{try{const raw=localStorage.getItem(key);if(!raw)throw Error('当前网址没有已保存数据');const d=validate(JSON.parse(raw));field.value=raw;status.textContent=JSON.stringify({courses:d.courses.length,assignments:d.assignments.length});}catch(e){status.textContent=e.message;}};
document.getElementById('merge').onclick=()=>{try{const incoming=validate(JSON.parse(field.value));const raw=localStorage.getItem(key);const current=raw?validate(JSON.parse(raw)):{courses:[],assignments:[]};const isDemo=current.courses.length===4&&current.assignments.length===6&&current.courses.every((c,i)=>c.id==='course-'+i)&&current.assignments.every((a,i)=>a.id==='assignment-'+i&&a.createdAt===a.updatedAt);if(isDemo){current.courses=[];current.assignments=[];}const combine=(a,b)=>Array.from(new Map([...a,...b].map(x=>[x.id,x])).values());const merged={...current,...incoming,courses:combine(current.courses,incoming.courses),assignments:combine(current.assignments,incoming.assignments)};const ids=new Set(merged.courses.map(c=>c.id));if(merged.assignments.some(a=>!ids.has(a.courseId)))throw Error('作业缺少对应课程');localStorage.setItem(backup,JSON.stringify({raw}));localStorage.setItem(key,JSON.stringify(merged));field.value=localStorage.getItem(key);status.textContent='迁移成功 '+JSON.stringify({courses:merged.courses.length,assignments:merged.assignments.length});}catch(e){status.textContent=e.message;}};
document.getElementById('undo').onclick=()=>{const b=JSON.parse(localStorage.getItem(backup)||'null');if(!b){status.textContent='没有备份';return;}if(b.raw===null)localStorage.removeItem(key);else localStorage.setItem(key,b.raw);status.textContent='已恢复迁移前的数据';};
</script></body></html>
